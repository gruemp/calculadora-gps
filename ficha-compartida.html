<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Ficha de ubicación compartida desde Control GPS con acciones de Google Maps, indicaciones y contacto.">
  <title>Ficha de ubicación · Control GPS</title>
  <style>
    :root{color-scheme:light}
    body{margin:0;min-height:100vh;padding:clamp(10px,3.5vw,38px);box-sizing:border-box;background:#edf5ee;font:16px/1.5 system-ui,Arial,sans-serif}
    #error{max-width:650px;margin:40px auto;padding:25px;border:1px solid #cddfd3;border-radius:16px;background:white;color:#264636}
    #error[hidden]{display:none}
    .help{max-width:960px;margin:14px auto 0;color:#5a7868;font-size:12px;text-align:center}
  </style>
  <script src="fichas-gps.js?v=20261027-2" defer></script>
</head>
<body>
  <main id="shared" aria-label="Ficha de ubicación"></main>
  <div id="error" hidden role="alert">No fue posible abrir esta ficha. Verifica que el enlace esté completo.</div>
  <p id="info" class="help" hidden>Los botones funcionan dentro de esta ficha web. Si la compartes, cualquier persona con el enlace puede ver la ubicación y los datos de contacto incluidos.</p>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const hash=location.hash;
        if (!hash.startsWith('#f=')) throw Error('Falta la ficha en el enlace.');
        const raw=hash.slice(3).replace(/-/g,'+').replace(/_/g,'/');
        if (raw.length > 12000) throw Error('Ficha demasiado larga.');
        const padded=raw+'='.repeat((4-raw.length%4)%4);
        const bytes=Uint8Array.from(atob(padded), char=>char.charCodeAt(0));
        const record=JSON.parse(new TextDecoder().decode(bytes));
        document.getElementById('shared').innerHTML=window.GpsCards.renderShared(record);
        document.getElementById('info').hidden=false;
        document.title=String(record.n||'Ficha de ubicación').slice(0,90)+' · Control GPS';
      } catch (error) {
        document.getElementById('error').hidden=false;
      }
    });
  </script>
</body>
</html>
