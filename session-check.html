<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobación privada de Control GPS</title>
<body><h1>Comprobación privada de Control GPS</h1><p>Solo comprueba la sesión autorizada. No modifica ubicaciones.</p><button id="check">Comprobar sesión privada</button><p id="status" role="status">Preparado.</p><div id="frame"></div>
<script src="gps-google-service.js?v=20261101-session-1"></script><script src="gps-session.js?v=20261031-auto-names-1"></script>
<script>
document.getElementById('check').addEventListener('click',async()=>{
 document.getElementById('check').disabled=true;
 const session=new GpsSession.Bridge(CONTROL_GPS_GOOGLE_SERVICE.sessionBridgeUrl);
 const ready=session.connect();clearTimeout(session.startTimer);
 session.frame.hidden=false;session.frame.width='100%';session.frame.height='420';document.getElementById('frame').append(session.frame);
 document.getElementById('status').textContent='Esperando la sesión de Google. El marco permite comprobar su respuesta.';
 try{await ready;const health=await session.call({action:'status',clientVersion:3,historyEpoch:'initial'});
 document.getElementById('status').textContent=health.service==='control-gps'?'Sesión privada conectada. Servicio autorizado.':'Servicio incompatible.';
 }catch(error){document.getElementById('status').textContent=error.message;}
});
</script></body></html>
